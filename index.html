<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCARPETPRO System</title>
    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- PDF & QR Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    
    <style>
        body { background-color: #f4f7fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; padding: 20px; width: 250px; position: fixed; }
        .content { margin-left: 250px; padding: 30px; }
        .nav-link { color: #adb5bd; cursor: pointer; }
        .nav-link:hover, .nav-link.active { color: #fff; background-color: #dc3545; border-radius: 5px; }
        .section-container { display: none; }
        .section-container.active { display: block; }
        
        /* Stiker QR 40x30mm */
        .qr-sticker { width: 40mm; height: 30mm; border: 1px dashed #000; padding: 2mm; text-align: center; box-sizing: border-box; display: inline-block; margin: 2px; page-break-after: always; }
        .qr-sticker .header { font-size: 6px; font-weight: bold; }
        .qr-sticker .inv { font-size: 7px; font-weight: bold; }
        .qr-sticker canvas { width: 100%; height: 11mm; }
        .qr-sticker .id-text { font-size: 5.5px; font-weight: bold; font-family: monospace; }
        .qr-sticker .footer { font-size: 5px; border-top: 0.5px solid #000; padding-top: 1px; font-weight: bold; }

        @media print { .no-print { display: none !important; } .qr-sticker { border: none !important; page-break-after: always; } @page { size: 40mm 30mm; margin: 0; } }

        /* PDF Invois Preview Style (To match design) */
        .invoice-box { background: white; padding: 30px; border: 1px solid #ddd; max-width: 800px; margin: 0 auto; }
        .inv-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .inv-title { color: #ff6d00; font-size: 32px; font-weight: bold; }
        .inv-info-box { border: 1px solid #000; padding: 5px; }
        .inv-banner { background: #ff6d00; color: white; padding: 5px 10px; font-weight: bold; margin-top: 10px; }
        .inv-status-badge { border: 1px solid #ff6d00; background: #fff0ed; color: #ff6d00; font-weight: bold; text-align: center; padding: 5px; float: right; }
        .inv-status-paid { border: 1px solid #28a745; background: #e6f5ea; color: #28a745; }
        .inv-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .inv-table th { background: #ff6d00; color: white; padding: 5px; border: 1px solid #ff6d00; font-size: 12px; }
        .inv-table td { border: 1px solid #000; padding: 5px; font-size: 12px; }
        .inv-summary { float: right; margin-top: 10px; border-collapse: collapse; }
        .inv-summary td { border: 1px solid #000; padding: 3px 10px; font-size: 12px; }
        .inv-footer-msg { color: #28a745; font-style: italic; font-weight: bold; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4 class="mb-4"><i class="fas fa-cube me-2"></i>MYCARPETPRO</h4>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link active" onclick="switchTab('tab-tempahan')"><i class="fas fa-plus-circle me-2"></i>Tempahan Baru</a></li>
            <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-katalog')"><i class="fas fa-list me-2"></i>Katalog Harga</a></li>
            <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-invois')"><i class="fas fa-file-invoice me-2"></i>Invois</a></li>
            <li class="nav-item"><a class="nav-link" onclick="switchTab('tab-barcode')"><i class="fas fa-qrcode me-2"></i>Barcode / QR</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div id="loading-spinner" class="text-center p-5"><div class="spinner-border text-danger"></div><p>Memuatkan Data...</p></div>

        <!-- 1. TEMPAHAN BARU -->
        <div id="tab-tempahan" class="section-container active">
            <h3>📝 Tempahan Baru</h3>
            <div class="card p-4 shadow-sm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Pelanggan (ID / Nama)</label>
                        <select id="cust-select" class="form-select"></select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Pilih Jenis Karpet (Harga Auto-Kira)</label>
                        <select id="carpet-select" class="form-select">
                            <option value="">-- Pilih Karpet --</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Kuantiti</label>
                        <input type="number" id="qty-input" class="form-control" value="1" min="1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Harga Seunit (RM)</label>
                        <input type="text" id="price-display" class="form-control" readonly placeholder="Akan dikira automatik">
                    </div>
                </div>
                <button class="btn btn-danger w-100" onclick="submitTempahan()"><i class="fas fa-save me-2"></i>Simpan Tempahan</button>
            </div>
        </div>

        <!-- 2. KATALOG HARGA -->
        <div id="tab-katalog" class="section-container">
            <h3>📋 Katalog Harga</h3>
            <div class="card p-4 shadow-sm">
                <table class="table table-bordered table-hover" id="katalog-table">
                    <thead class="table-dark"><tr><th>KOD</th><th>JENIS CARPET</th><th>LEBAR</th><th>PANJANG</th><th>HARGA SQFT</th><th>HARGA DARAB</th></tr></thead>
                    <tbody id="katalog-body"></tbody>
                </table>
                <div class="alert alert-info mt-3"><i class="fas fa-calculator me-2"></i>Formula: (Lebar x Panjang) x Harga Darab = Harga Jualan.</div>
            </div>
        </div>

        <!-- 3. INVOIS -->
        <div id="tab-invois" class="section-container">
            <h3>🧾 Cetak Invois</h3>
            <div class="card p-4 shadow-sm">
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label>Pilih Invois (No - Pelanggan - Alamat)</label>
                        <select id="invoice-select" class="form-select">
                            <option value="">-- Sila Pilih Invois --</option>
                        </select>
                    </div>
                </div>
                <div id="invoice-preview-area" class="mt-3"></div>
                <button class="btn btn-success w-100 no-print mt-3" onclick="generatePDF()"><i class="fas fa-file-pdf me-2"></i>Jana & Muat Turun PDF</button>
            </div>
        </div>

        <!-- 4. BARCODE / QR -->
        <div id="tab-barcode" class="section-container">
            <h3>🖨️ Cetak Barcode</h3>
            <div class="card p-4 shadow-sm">
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label>Pilih Invois (No - Pelanggan - Alamat)</label>
                        <select id="barcode-select" class="form-select">
                            <option value="">-- Sila Pilih Invois --</option>
                        </select>
                    </div>
                </div>
                <div id="barcode-preview-area" class="mt-3 text-center"></div>
                <button class="btn btn-primary w-100 no-print mt-3" onclick="printBarcodes()"><i class="fas fa-print me-2"></i>Cetak Stiker QR (40x30mm)</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // KONFIGURASI
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyDZGqIqcloW_acpOe7MOYRHvG4neZK0oRiUP5-Cqq8K1oR2-RYOw-Icp6bBRL5yzX3/exec";
        let globalData = { senaraiHarga: [], pelanggan: [], tempahan: [], karpet: [], payment: [] };

        // 1. LOAD DATA DARI GAS
        async function loadData() {
            try {
                const response = await fetch(GAS_URL + "?action=readAll");
                globalData = await response.json();
                document.getElementById("loading-spinner").style.display = "none";
                populateDropdowns();
                renderKatalog();
            } catch (error) {
                document.getElementById("loading-spinner").innerHTML = `<div class="alert alert-danger">Ralat: ${error.message}</div>`;
            }
        }

        // 2. NAVIGASI TAB
        function switchTab(tabId) {
            document.querySelectorAll('.section-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // 3. POPULATE DROPDOWNS
        function populateDropdowns() {
            // Pelanggan
            const custSelect = document.getElementById('cust-select');
            custSelect.innerHTML = '<option value="">-- Pilih Pelanggan --</option>';
            globalData.pelanggan.forEach(p => {
                custSelect.innerHTML += `<option value="${p['CUSTOMER ID']}">${p['NAMA']} (${p['CUSTOMER ID']})</option>`;
            });

            // Karpet & Harga (Tempahan)
            const carpetSelect = document.getElementById('carpet-select');
            carpetSelect.innerHTML = '<option value="">-- Pilih Karpet --</option>';
            globalData.senaraiHarga.forEach(item => {
                const label = `${item['KOD']} - ${item['JENIS CARPET']} (RM ${item['HARGA_SQFT']}/sqft)`;
                carpetSelect.innerHTML += `<option value='${JSON.stringify(item)}'>${label}</option>`;
            });
            carpetSelect.onchange = function() {
                if(this.value) {
                    const data = JSON.parse(this.value);
                    const luas = data['LEBAR'] * data['PANJANG'];
                    const total = luas * data['HARGA_SQFT'];
                    document.getElementById('price-display').value = total.toFixed(2);
                } else {
                    document.getElementById('price-display').value = "";
                }
            };

            // Invois & Barcode Dropdown (Dengan ALAMAT)
            const invSelect = document.getElementById('invoice-select');
            const bcSelect = document.getElementById('barcode-select');
            invSelect.innerHTML = '<option value="">-- Sila Pilih Invois --</option>';
            bcSelect.innerHTML = '<option value="">-- Sila Pilih Invois --</option>';

            globalData.tempahan.forEach(t => {
                const cust = globalData.pelanggan.find(p => p['CUSTOMER ID'] === t['CUSTOMER ID']);
                const nama = cust ? cust['NAMA'] : t['CUSTOMER ID'];
                const alamat = cust ? cust['ALAMAT'] : "-";
                // TAMPILKAN ALAMAT DALAM DROPDOWN
                const label = `${t['INV NO']} - ${nama} - ${alamat}`;
                const opt = `<option value="${t['INV NO']}">${label}</option>`;
                invSelect.innerHTML += opt;
                bcSelect.innerHTML += opt;
            });
            
            invSelect.onchange = () => renderInvoicePreview();
            bcSelect.onchange = () => renderBarcodePreview();
        }

        // 4. SIMPAN TEMPAHAN
        async function submitTempahan() {
            const custId = document.getElementById('cust-select').value;
            const carpetData = document.getElementById('carpet-select').value;
            const qty = parseInt(document.getElementById('qty-input').value);

            if(!custId || !carpetData || qty < 1) return alert("Sila lengkapi semua ruangan!");
            
            const item = JSON.parse(carpetData);
            const items = [{ kod: item['KOD'], jenis: item['JENIS CARPET'], harga: parseFloat(document.getElementById('price-display').value), qty: qty }];

            // Hantar ke GAS
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "createOrder", customer: { id: custId }, items: items })
            });
            const result = await response.json();
            if(result.success) {
                alert(`Tempahan Berjaya! No Invois: ${result.invoice}`);
                location.reload();
            } else {
                alert("Ralat: " + result.message);
            }
        }

        // 5. RENDER KATALOG
        function renderKatalog() {
            const tbody = document.getElementById('katalog-body');
            tbody.innerHTML = '';
            globalData.senaraiHarga.forEach(item => {
                const row = `<tr>
                    <td>${item['KOD']}</td>
                    <td>${item['JENIS CARPET']}</td>
                    <td>${item['LEBAR']}</td>
                    <td>${item['PANJANG']}</td>
                    <td>RM ${item['HARGA_SQFT'].toFixed(2)}</td>
                    <td>RM ${(item['LEBAR'] * item['PANJANG'] * item['HARGA_SQFT']).toFixed(2)}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // 6. GENERATE INVOICE PREVIEW & PDF
        function renderInvoicePreview() {
            const invNo = document.getElementById('invoice-select').value;
            if(!invNo) return document.getElementById('invoice-preview-area').innerHTML = '';
            
            const tempahan = globalData.tempahan.find(t => t['INV NO'] === invNo);
            const cust = globalData.pelanggan.find(p => p['CUSTOMER ID'] === tempahan['CUSTOMER ID']);
            const karpets = globalData.karpet.filter(k => k['INV NO'] === invNo);
            const payments = globalData.payment.filter(p => p['INV NO'] === invNo);
            const totalBayaran = payments.reduce((sum, p) => sum + p['AMAUN DIBAYAR'], 0);
            const subTotal = karpets.reduce((sum, k) => sum + k['HARGA'], 0);
            const jumlahBersih = subTotal - totalBayaran;
            const status = jumlahBersih <= 0 ? "PAID" : "PENDING";

            // Bina HTML Invois (Mengikut design asal)
            let html = `
            <div id="invoice-to-print" class="invoice-box">
                <div class="inv-header">
                    <div>
                        <h4>WESTBERRY ENTERPRISE</h4>
                        <small>LOT 52 JALAN PERUSAHAAN, KG SIAM,<br>PAYA BESAR 09600 LUNAS KEDAH.<br>TEL: 017-4050336</small>
                    </div>
                    <div style="text-align: right;">
                        <div class="inv-title">INVOICE</div>
                        <div class="inv-info-box mt-2">
                            <div><b>INVOICE NO</b> ${invNo}</div>
                            <div><b>DATE</b> ${new Date().toISOString().split('T')[0]}</div>
                        </div>
                    </div>
                </div>
                <div class="inv-banner">INVOICE TO</div>
                <div style="margin-top: 10px; position: relative;">
                    <b>${cust['NAMA']} (${cust['CUSTOMER ID']})</b><br>
                    Alamat: ${cust['ALAMAT']}<br>
                    No. Telefon: ${cust['TELEFON']}
                    <div class="inv-status-badge ${status === 'PAID' ? 'inv-status-paid' : ''}">${status}</div>
                </div>
                <table class="inv-table">
                    <thead><tr><th>BIL</th><th>KETERANGAN SERVIS / JENIS CARPET</th><th>UNIT</th><th>HARGA SEUNIT (RM)</th><th>TOTAL (RM)</th></tr></thead>
                    <tbody>`;
            karpets.forEach((k, i) => {
                html += `<tr><td>${i+1}</td><td>${k['JENIS']} [QR ID: ${k['QR ID']}]</td><td>1</td><td>${k['HARGA'].toFixed(2)}</td><td>${k['HARGA'].toFixed(2)}</td></tr>`;
            });
            html += `</tbody></table>
                <div style="overflow: hidden; margin-top: 10px;">
                    <table class="inv-summary">
                        <tr><td><b>SUB TOTAL</b></td><td>RM ${subTotal.toFixed(2)}</td></tr>
                        <tr><td><b>DEPOSIT</b></td><td>RM ${totalBayaran.toFixed(2)}</td></tr>
                        <tr style="background:#f5f5f5;"><td><b>JUMLAH BERSIH</b></td><td>RM ${jumlahBersih.toFixed(2)}</td></tr>
                    </table>
                </div>
                <div style="margin-top: 60px; display: flex; justify-content: space-between;">
                    <div>
                        <b>UNTUK PEMBAYARAN:</b><br>
                        <b>MAYBANK-MATI-UR REHMAN</b><br>
                        <span style="color: #b92b27; font-weight: bold;">15-203-142-4070</span>
                    </div>
                    <div style="text-align: center;">
                        DISEDIAKAN OLEH / COP:<br>
                        <img src="https://raw.githubusercontent.com/Mrehman84/MYCARPET_PRO/main/tandatangan.png" style="height:40px; width:auto; margin: 5px 0;"><br>
                        <div style="border-top: 1px solid #000; padding-top: 3px;">( MYCARPETPRO.V2 MANAGEMENT )</div>
                    </div>
                </div>
                <div style="margin-top: 30px; font-size: 10px;">
                    <b>TERMA & SYARAT PEMBAYARAN:</b><br>
                    1. Sila jelaskan baki bayaran penuh semasa penghantaran atau pengambilan karpet dilakukan.<br>
                    2. Sila sertakan resit/bukti transaksi Online Transfer kepada pihak kami untuk pengesahan baki.<br>
                    3. Hubungi kami di talian 017-4050336 atau layari media sosial kami @mycarpetpro untuk sebarang maklum balas.
                    <div class="inv-footer-msg">
                        Thank you for your business! We look forward to serving you again.<br>
                        ~~~ Terima kasih kerana memilih MYCARPET PRO! Sokongan Anda amat kami hargai ~~~
                    </div>
                </div>
            </div>`;
            document.getElementById('invoice-preview-area').innerHTML = html;
        }

        function generatePDF() {
            const element = document.getElementById('invoice-to-print');
            if(!element) return alert("Sila pilih Invois terlebih dahulu!");
            const opt = { margin: 10, filename: `Invoice_${document.getElementById('invoice-select').value}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save();
        }

        // 7. GENERATE BARCODE (QR) STICKERS
        function renderBarcodePreview() {
            const invNo = document.getElementById('barcode-select').value;
            if(!invNo) return document.getElementById('barcode-preview-area').innerHTML = '';
            
            const tempahan = globalData.tempahan.find(t => t['INV NO'] === invNo);
            const cust = globalData.pelanggan.find(p => p['CUSTOMER ID'] === tempahan['CUSTOMER ID']);
            const karpets = globalData.karpet.filter(k => k['INV NO'] === invNo);
            
            let html = `<div id="sticker-print-area">`;
            karpets.forEach(k => {
                const qrId = k['QR ID'];
                const kod = k['KOD'];
                const cusId = cust['CUSTOMER ID'];
                const tel = cust['TELEFON'];
                
                html += `
                <div class="qr-sticker">
                    <div class="header">MYCARPET PRO v2.0</div>
                    <div class="inv">INV: ${invNo}</div>
                    <div class="barcode-zone"><canvas id="qr-${qrId}"></canvas></div>
                    <div class="id-text">QR ID: ${qrId}</div>
                    <div class="footer">KDD: ${kod} | CUS: ${cusId} | TEL: ${tel}</div>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('barcode-preview-area').innerHTML = html;

            // Generate QR Codes after DOM update
            setTimeout(() => {
                karpets.forEach(k => {
                    const canvas = document.getElementById(`qr-${k['QR ID']}`);
                    if(canvas) QRCode.toCanvas(canvas, k['QR ID'], { width: 80 });
                });
            }, 100);
        }

        function printBarcodes() {
            const printContents = document.getElementById('sticker-print-area').innerHTML;
            const win = window.open('', '', 'height=600,width=800');
            win.document.write('<html><head><title>Print QR Stickers</title>');
            win.document.write('<style>.qr-sticker { width: 40mm; height: 30mm; border: 1px dashed #000; padding: 2mm; text-align: center; box-sizing: border-box; display: inline-block; margin: 2px; page-break-after: always; } .header { font-size: 6px; font-weight: bold; } .inv { font-size: 7px; font-weight: bold; } .barcode-zone canvas { width: 100%; height: 11mm; } .id-text { font-size: 5.5px; font-weight: bold; font-family: monospace; } .footer { font-size: 5px; border-top: 0.5px solid #000; padding-top: 1px; font-weight: bold; } @page { size: 40mm 30mm; margin: 0; } .qr-sticker { border: none !important; }</style>');
            win.document.write('</head><body>');
            win.document.write(printContents);
            win.document.write('<script>window.print();window.close();<' + '/script>');
            win.document.write('</body></html>');
            win.document.close();
            win.focus();
        }

        // INIT
        window.onload = loadData;
    </script>
</body>
</html>
