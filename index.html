<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MYCARPET PRO v2.0</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--primary-red:#ff4b4b;
--dark:#202124;
--bg:#f5f6fa;
--card:#ffffff;
--border:#e5e7eb;
--success:#18b36b;
--warning:#ffb100;
--blue:#3b82f6;
--grey:#6b7280;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:var(--bg);
display:flex;
min-height:100vh;

}

/* =======================
SIDEBAR
======================= */

.sidebar{

width:250px;
background:#fff;
border-right:1px solid #ddd;
display:flex;
flex-direction:column;
position:fixed;
left:0;
top:0;
bottom:0;

}

.logo{

padding:25px;
text-align:center;
border-bottom:1px solid #eee;

}

.logo h2{

color:var(--primary-red);

}

.logo p{

font-size:13px;
color:#777;

}

.menu{

padding:15px;

}

.menu button{

width:100%;
padding:14px;
margin-bottom:10px;

border:none;
border-radius:12px;

background:white;

cursor:pointer;

font-size:15px;

text-align:left;

transition:.25s;

}

.menu button:hover{

background:#ffecec;

}

.menu button.active{

background:var(--primary-red);
color:white;

}

/* =======================
CONTENT
======================= */

.main{

margin-left:250px;
width:100%;
display:flex;
flex-direction:column;

}

.header{

height:70px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;

padding:0 30px;

border-bottom:1px solid #ddd;

}

.header h1{

font-size:24px;
font-weight:600;

}

.badge-online{

background:#18b36b;
color:white;
padding:8px 14px;
border-radius:30px;
font-size:13px;

}

/* =======================
CONTENT BODY
======================= */

.page{

padding:25px;

}

/* =======================
CARDS
======================= */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}

.card{

background:white;

padding:25px;

border-radius:16px;

box-shadow:0 4px 10px rgba(0,0,0,.05);

}

.card h3{

font-size:15px;
color:#666;

}

.card h2{

margin-top:12px;
font-size:34px;
color:var(--primary-red);

}

/* =======================
TABLE
======================= */

table{

width:100%;

border-collapse:collapse;

background:white;

border-radius:12px;

overflow:hidden;

}

th{

background:var(--primary-red);

color:white;

padding:14px;

}

td{

padding:12px;

border-bottom:1px solid #eee;

}

/* =======================
FORM
======================= */

.form-card{

background:white;

padding:25px;

border-radius:16px;

margin-bottom:20px;

}

label{

display:block;
margin-bottom:8px;
font-weight:500;

}

input,
select,
textarea{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:10px;

margin-bottom:15px;

font-size:14px;

}

button.primary{

background:var(--primary-red);

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;

}

button.secondary{

background:#eee;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;

}

/* =======================
STATUS BADGE
======================= */

.status{

padding:6px 12px;

border-radius:20px;

font-size:12px;

color:white;

display:inline-block;

}

.proses{

background:#f39c12;

}

.cuci{

background:#3498db;

}

.ready{

background:#8e44ad;

}

.selesai{

background:#2ecc71;

}

/* =======================
TAB
======================= */

.tab{

display:none;

}

.tab.active{

display:block;

}

/* =======================
FOOTER
======================= */

.footer{

text-align:center;

padding:20px;

font-size:13px;

color:#777;

}

/* =======================
RESPONSIVE
======================= */

@media(max-width:900px){

.sidebar{

position:relative;
width:100%;
height:auto;

}

.main{

margin-left:0;

}

body{

flex-direction:column;

}

.cards{

grid-template-columns:1fr;

}

.header{

padding:15px;

flex-direction:column;
height:auto;

gap:10px;

}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

<h2>MYCARPET PRO</h2>

<p>Version 2.0</p>

</div>

<div class="menu">

<button class="active"
onclick="showTab('dashboard')">

🏠 Dashboard

</button>

<button
onclick="showTab('tempahan')">

🧾 Tempahan Baru

</button>

<button
onclick="showTab('tracking')">

📦 Scan & Tracking

</button>

<button
onclick="showTab('pelanggan')">

👥 Pelanggan

</button>

<button
onclick="showTab('laporan')">

📊 Laporan

</button>

<button
onclick="showTab('setting')">

⚙ Tetapan

</button>

</div>

</div>

<!-- MAIN -->

<div class="main">

<div class="header">

<h1>MYCARPET PRO v2.0</h1>

<div class="badge-online">

● Google Sheets Connected

</div>

</div>

<div class="page">

<!-- Dashboard -->
<div id="dashboard" class="tab active">
<!-- Kandungan Bahagian 2 -->
</div>

<!-- Tempahan -->
<div id="tempahan" class="tab">
<!-- Kandungan Bahagian 2 -->
</div>

<!-- Tracking -->
<div id="tracking" class="tab">
<!-- Kandungan Bahagian 2 -->
</div>

<!-- Pelanggan -->
<div id="pelanggan" class="tab">
<!-- Kandungan Bahagian 2 -->
</div>

<!-- Laporan -->
<div id="laporan" class="tab">
<!-- Kandungan Bahagian 2 -->
</div>

<!-- Setting -->
<div id="setting" class="tab">
<!-- Kandungan Bahagian 2 -->
</div>

</div>

<div class="footer">

MYCARPET PRO v2.0 © 2026

</div>

</div>

</body>

</html>
